plugins {
    id "com.android.application"
}

android {
    namespace "com.discretevic.avselector"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.discretevic.avselector"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // Release signing comes from ~/.gradle/gradle.properties (never committed).
    // Without it, assembleRelease produces an unsigned APK.
    if (project.hasProperty("AVSELECTOR_STORE_FILE")) {
        signingConfigs {
            release {
                storeFile file(AVSELECTOR_STORE_FILE)
                storePassword AVSELECTOR_STORE_PASSWORD
                keyAlias AVSELECTOR_KEY_ALIAS
                keyPassword AVSELECTOR_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty("AVSELECTOR_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
